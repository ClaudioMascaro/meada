[package]
name = "meada-core"
version = "2.0.0"
edition.workspace = true
description = "The deterministic core of Meada: the workspace manifest's schema and checks, the ids, the export's types and the text answers, for the CLI and the browser"
license.workspace = true
repository.workspace = true
keywords = ["code-graph", "meada", "wasm"]
categories = ["development-tools"]

[lints]
workspace = true

[package.metadata.dist]
dist = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = "1.8.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
wasm-bindgen = { version = "0.2.129", optional = true }

[features]
wasm-bindgen = ["dep:wasm-bindgen"]
