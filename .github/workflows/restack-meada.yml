name: Prepare the Meada PR stack
on:
  push:
    branches: [verify/restack-driver-20261121]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: cp .github/restack-meada.sh "$RUNNER_TEMP/restack-meada.sh" && bash "$RUNNER_TEMP/restack-meada.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: meada-restack-preparation
          path: ${{ runner.temp }}/restack/
