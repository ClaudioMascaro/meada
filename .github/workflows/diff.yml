name: Diff

on:
  push:
    branches-ignore: [main, 'loop/**']

concurrency:
  group: diff-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: '2'

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks
        id: scope
        run: python3 scripts/check --ci
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        if: steps.scope.outputs.deploy == 'true' && steps.scope.outputs.product == 'true'
        with:
          version: v3.19.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.scope.outputs.product == 'true'
        with:
          shared-key: test
          save-if: false
      - name: Static checks and the tests of the changed modules
        run: |
          python3 -m venv "$RUNNER_TEMP/check-venv"
          "$RUNNER_TEMP/check-venv/bin/pip" install --disable-pip-version-check PyYAML==6.0.3
          "$RUNNER_TEMP/check-venv/bin/python" scripts/check --scope auto
      - name: Build the debug binary
        if: steps.scope.outputs.product == 'true'
        run: cargo build --locked
      - name: Retain the debug binary
        if: steps.scope.outputs.product == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: meada-debug-${{ github.sha }}
          path: target/debug/meada
          if-no-files-found: error
          overwrite: true
          retention-days: 7
