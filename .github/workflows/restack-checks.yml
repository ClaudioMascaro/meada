name: Verify the exact Meada stack candidates
on:
  push:
    branches: [verify/restack-checks-20261121]
permissions:
  actions: read
  contents: read
jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 33
    strategy:
      fail-fast: false
      matrix:
        pr: [941, 943, 944]
    env:
      PR: ${{ matrix.pr }}
      MODE: probe
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      RUST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: restack-probe
      - name: Run exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .github/restack-checks.sh "$RUNNER_TEMP/restack-checks.sh"
          cp .github/restack-probe.py "$RUNNER_TEMP/probe.py"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check PyYAML==6.0.3 python-hcl2==8.1.4
          bash "$RUNNER_TEMP/restack-checks.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: restack-probe-${{ matrix.pr }}
          path: |
            ${{ runner.temp }}/restack-evidence/
            !${{ runner.temp }}/restack-evidence/*/work/
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        pr: [941, 943, 944, 947, 959, 960]
    env:
      PR: ${{ matrix.pr }}
      MODE: checks
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      RUST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: restack-checks
      - name: Run exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .github/restack-checks.sh "$RUNNER_TEMP/restack-checks.sh"
          cp .github/restack-probe.py "$RUNNER_TEMP/probe.py"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check PyYAML==6.0.3 python-hcl2==8.1.4
          bash "$RUNNER_TEMP/restack-checks.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: restack-checks-${{ matrix.pr }}
          path: |
            ${{ runner.temp }}/restack-evidence/
            !${{ runner.temp }}/restack-evidence/*/work/
  features:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        pr: [941, 943, 944, 947, 959]
    env:
      PR: ${{ matrix.pr }}
      MODE: features
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      RUST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: restack-features
      - name: Run exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .github/restack-checks.sh "$RUNNER_TEMP/restack-checks.sh"
          cp .github/restack-probe.py "$RUNNER_TEMP/probe.py"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check PyYAML==6.0.3 python-hcl2==8.1.4
          bash "$RUNNER_TEMP/restack-checks.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: restack-features-${{ matrix.pr }}
          path: |
            ${{ runner.temp }}/restack-evidence/
            !${{ runner.temp }}/restack-evidence/*/work/
