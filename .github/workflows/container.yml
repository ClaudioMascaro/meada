name: Container

on:
  release:
    types: [published]
  # cargo-dist publishes with GITHUB_TOKEN, whose release event starts no workflow.
  workflow_run:
    workflows: [Release]
    types: [completed]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/container.yml
      - scripts/container-smoke

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: meada:check
      - run: python3 scripts/container-smoke meada:check

  publish:
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: ""
            suffix: ""
          - features: cloud
            suffix: -cloud
    steps:
      - name: Published release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.workflow_run.head_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          if [ -n "$RELEASE_SHA" ]; then
            # release.yml gives gh release create --target the exact release commit.
            test "$(jq -r '.target_commitish' <<< "$release")" = "$RELEASE_SHA"
          fi
          test "$(jq -r '.draft' <<< "$release")" = false
          tag=$(jq -er '.tag_name' <<< "$release")
          prerelease=$(jq -er '.prerelease | tostring' <<< "$release")
          {
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
      - name: Image tags
        id: image
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          SUFFIX: ${{ matrix.suffix }}
        shell: bash
        run: |
          version=${RELEASE_TAG#v}
          image=ghcr.io/claudiomascaro/meada
          {
            echo "version=$version"
            echo 'tags<<TAGS'
            echo "$image:$version$SUFFIX"
            if [ "$PRERELEASE" = false ]; then echo "$image:latest$SUFFIX"; fi
            echo TAGS
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            FEATURES=${{ matrix.features }}
            VERSION=${{ steps.image.outputs.version }}
