name: Proof

# E2E and the bounded #676/#684 proofs, apart from the required gates in `ci.yml` so their
# skipped jobs never share a required check's name. A pull request runs E2E only with the `e2e`
# label, on a non-draft PR and a relevant change (`scripts/check --ci`).
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, ready_for_review]
  workflow_dispatch:
    inputs:
      proof_phase:
        description: 'Bounded #676/#684 phase (full CI remains the PR/push gate)'
        type: choice
        options: [baseline, candidate, check, final]
        default: baseline
      baseline_run:
        description: 'Exact successful baseline Actions run ID, required after baseline'
        type: string
      candidate_run:
        description: 'Opaque candidate Actions run ID, required for check'
        type: string
      ui_run:
        description: 'UI/scope run bound to the exact baseline manifest (defaults to baseline_run)'
        type: string
      mutation:
        description: 'Auditor only: one A7-01..A7-08 or A8-01..A8-05 ID'
        type: string
      baseline_attestation:
        description: 'Fresh checker JSON: verdict, checker, receipt, baseline_manifest_sha256'
        type: string

concurrency:
  group: proof-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'e2e' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # CPU-heavy reader probes share the runner; bound their concurrent test count.
  RUST_TEST_THREADS: '2'

permissions:
  contents: read

# rustup, preinstalled on the runners, installs the toolchain `rust-toolchain.toml` pins on the
# first cargo command. The image is pinned: `ubuntu-latest` moves to 26.04 from 2026-10-19
# (actions/runner-images#14748), and a new image is a change of its own.
jobs:
  e2e-scope:
    runs-on: ubuntu-24.04
    outputs:
      routine: ${{ steps.scope.outputs.routine }}
      product: ${{ steps.scope.outputs.product }}
      e2e: ${{ steps.scope.outputs.e2e }}
      cli: ${{ steps.scope.outputs.cli }}
      console: ${{ steps.scope.outputs.console }}
      accounts: ${{ steps.scope.outputs.accounts }}
      deploy: ${{ steps.scope.outputs.deploy }}
      container: ${{ steps.scope.outputs.container }}
      goldens: ${{ steps.scope.outputs.goldens }}
      base: ${{ steps.scope.outputs.base }}
      head: ${{ steps.scope.outputs.head }}
      repos: ${{ steps.scope.outputs.repos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select milestone E2E
        id: scope
        run: python3 scripts/check --ci

  e2e-frontend:
    needs: e2e-scope
    if: >-
      (needs.e2e-scope.outputs.e2e == 'true' && needs.e2e-scope.outputs.console == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.proof_phase == 'baseline')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: rustup target add wasm32-unknown-unknown
      - name: meada-core carries none of the binary's crates
        shell: bash
        run: |
          crates=$(cargo tree --locked -p meada-core -e normal --all-features --target all --prefix none --format '{p}' | cut -d' ' -f1 | sort -u)
          forbidden=$(grep -xE 'rusqlite|libsqlite3-sys|tree-sitter.*|tokio|async-std|smol|async-executor|object_store|reqwest|redis|ureq|nix|hyper' <<<"$crates" || true)
          if [ -n "$forbidden" ]; then echo "meada-core lists: $forbidden"; exit 1; fi
      - name: No build of the binary carries wasm-bindgen
        shell: bash
        run: |
          if cargo tree --locked -p meada -e normal --all-features --target all --prefix none --format '{p}' | cut -d' ' -f1 | grep -qx wasm-bindgen; then
            echo "meada lists wasm-bindgen"; exit 1
          fi
      - run: cargo build --locked -p meada-core --target wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          version=v0.15.0
          sha256=c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
          archive=$RUNNER_TEMP/wasm-pack.tar.gz
          curl -sSfL -o "$archive" "https://github.com/wasm-bindgen/wasm-pack/releases/download/$version/wasm-pack-$version-x86_64-unknown-linux-musl.tar.gz"
          echo "$sha256  $archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/wasm-pack"
          tar -xzf "$archive" -C "$RUNNER_TEMP/wasm-pack"
          install -m 755 "$(find "$RUNNER_TEMP/wasm-pack" -type f -name wasm-pack)" "$HOME/.cargo/bin/"
          wasm-pack --version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run wasm
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - name: Retain the frontend for selected E2E or the manual baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: meada-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: ui/dist
          if-no-files-found: error
          retention-days: 7

  # The explicit baseline binds native, UI and source captures to one source and manifest.

  proof-a7-a8:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      PROOF_PHASE: ${{ inputs.proof_phase || 'baseline' }}
      BASELINE_RUN: ${{ inputs.baseline_run }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      PROOF_MUTATION: ${{ inputs.mutation }}
      UI_RUN: ${{ inputs.ui_run }}
      PROVE_BASELINE_ATTESTATION: ${{ inputs.baseline_attestation }}
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Validate phase inputs and prepare only the proof readers
        run: |
          case "$PROOF_PHASE" in
            baseline) ;;
            candidate|check|final) [[ "$BASELINE_RUN" =~ ^[1-9][0-9]*$ ]] ;;
            *) exit 2 ;;
          esac
          if [ "$PROOF_PHASE" = check ]; then [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]*$ ]]; fi
          if [ -n "$UI_RUN" ]; then [[ "$UI_RUN" =~ ^[1-9][0-9]*$ ]]; fi
          python3 -m venv "$RUNNER_TEMP/a7-a8-venv"
          "$RUNNER_TEMP/a7-a8-venv/bin/pip" install --disable-pip-version-check python-hcl2==8.1.4 PyYAML==6.0.3
      # Binaries from these runs are executed: only this repository's own manual proof runs
      # qualify, never a fork's pull request run that could upload an artifact of the same name.
      - name: Accept only this repository's manual proof runs
        if: env.PROOF_PHASE != 'baseline'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in "$BASELINE_RUN" "$CANDIDATE_RUN" "$UI_RUN"; do
            [ -n "$id" ] || continue
            origin=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" \
              --jq '[.repository.full_name, .head_repository.full_name, .event, .path] | join(" ")')
            if [ "$origin" != "$GITHUB_REPOSITORY $GITHUB_REPOSITORY workflow_dispatch .github/workflows/proof.yml" ]; then
              echo "run $id is not a manual proof run of $GITHUB_REPOSITORY: $origin"
              exit 1
            fi
          done
      - name: Download frozen clean baseline
        if: env.PROOF_PHASE != 'baseline'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: a7-a8-baseline
          path: .prove-it/runs/ci-a7-a8-input/baseline
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}
      - name: Download opaque candidate packet
        if: env.PROOF_PHASE == 'check'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: a7-a8-candidate
          path: .prove-it/runs/ci-a7-a8-input/candidate
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
      - name: Download separately bound clean UI proof
        if: env.PROOF_PHASE == 'candidate'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: a7-a8-ui
          path: .prove-it/runs/ci-a7-a8-input/ui
          run-id: ${{ inputs.ui_run || inputs.baseline_run }}
          github-token: ${{ github.token }}
      - name: Download separately bound corpus, API and viewer captures
        if: env.PROOF_PHASE == 'candidate'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: a7-a8-scope
          path: .prove-it/runs/ci-a7-a8-input/scope
          run-id: ${{ inputs.ui_run || inputs.baseline_run }}
          github-token: ${{ github.token }}
      - name: Resolve the associated PR base for the clean baseline
        if: env.PROOF_PHASE == 'baseline'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f "head=$GITHUB_REPOSITORY_OWNER:$GITHUB_REF_NAME" -f per_page=100)
          PR_BASE=$(jq -er 'if length == 1 then .[0].base.sha else error("Expected exactly one open PR for this branch") end' <<< "$PR_JSON")
          [[ "$PR_BASE" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$PR_BASE"
          BASE_REF=$(git merge-base HEAD "$PR_BASE")
          echo "PROOF_BASE=$BASE_REF" >> "$GITHUB_ENV"
      - name: Run one bounded proof phase
        run: |
          P="$RUNNER_TEMP/a7-a8-venv/bin/python"
          S=.claude/skills/prove-meada/scripts/a7-a8-audit.py
          R=.prove-it/runs/ci-a7-a8
          B=.prove-it/runs/ci-a7-a8-input/baseline
          "$P" .claude/skills/prove-meada/scripts/prove.py selftest
          "$P" .claude/skills/prove-meada/scripts/a7-a8-audit-selfcheck.py --run "$R/safety-checks"
          "$P" "$S" validate-plan
          case "$PROOF_PHASE" in
            baseline)
              "$P" "$S" baseline --base-ref "$PROOF_BASE" --run "$R/baseline"
              ;;
            candidate)
              chmod +x "$B"/bin/meada-*
              "$P" "$S" candidate --baseline "$B" --ui-receipt .prove-it/runs/ci-a7-a8-input/ui/receipt.json \
                --scope-receipt .prove-it/runs/ci-a7-a8-input/scope/receipt.json \
                --mutation "$PROOF_MUTATION" --run .prove-it/audits/ci-a7-a8
              ;;
            check)
              chmod +x "$B"/bin/meada-* .prove-it/runs/ci-a7-a8-input/candidate/meada-candidate
              "$P" "$S" check --baseline "$B" --candidate .prove-it/runs/ci-a7-a8-input/candidate --run "$R/check"
              ;;
            final)
              chmod +x "$B"/bin/meada-*
              "$P" "$S" check --baseline "$B" --run "$R/final"
              ;;
          esac
      - name: Retain clean baseline including raw failures
        if: always() && env.PROOF_PHASE == 'baseline'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: a7-a8-baseline
          path: .prove-it/runs/ci-a7-a8/baseline
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Retain only the opaque candidate for the checker
        if: success() && env.PROOF_PHASE == 'candidate'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: a7-a8-candidate
          path: .prove-it/audits/ci-a7-a8/checker
          if-no-files-found: error
          retention-days: 30
      - name: Retain auditor originals, patch and exact restore receipt
        if: always() && env.PROOF_PHASE == 'candidate'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: a7-a8-auditor
          path: .prove-it/audits/ci-a7-a8/auditor
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Retain checker or final raw evidence, even on failure
        if: always() && (env.PROOF_PHASE == 'check' || env.PROOF_PHASE == 'final')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: a7-a8-checks
          path: .prove-it/runs/ci-a7-a8
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  proof-a7-a8-ui:
    needs: [proof-a7-a8, e2e-frontend]
    if: github.event_name == 'workflow_dispatch' && inputs.proof_phase == 'baseline'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ui/.nvmrc
      - name: Download the exact baseline frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meada-ui-${{ github.sha }}
          path: ui/dist
      - name: Install console browser proof tools
        env:
          PROVE_NODE: ${{ runner.temp }}/console-graph-node
        run: |
          npm install --prefix "$PROVE_NODE" --no-audit --no-fund playwright-core@1.61.1 axe-core@4.12.1
          "$PROVE_NODE/node_modules/.bin/playwright-core" install --with-deps chromium
      - name: Prove the console infrastructure graph
        id: console-graph-proof
        env:
          PROVE_NODE: ${{ runner.temp }}/console-graph-node
        run: |
          touch src/lib.rs src/main.rs meada-core/src/lib.rs
          cargo build --locked --features ui
          python3 .claude/skills/prove-meada/scripts/console-graph.py \
            --head-bin target/debug/meada --ui-dir ui/dist \
            --run .prove-it/runs/ci-console-graph
      - name: Download historical default binaries for the full UI drivers
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: a7-a8-baseline
          path: .prove-it/runs/ci-a7-a8-ui-input/baseline
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Prove full AWS SDK, config-use and image UI flows
        if: always()
        env:
          PROVE_NODE: ${{ runner.temp }}/console-graph-node
          CONSOLE_GRAPH_RESULT: ${{ steps.console-graph-proof.outcome }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          R=.prove-it/runs/ci-a7-a8-ui
          BOOTSTRAP_LOG="$RUNNER_TEMP/a7-a8-ui-bootstrap.log"
          touch "$BOOTSTRAP_LOG"
          trap 'mkdir -p "$R"; cp "$BOOTSTRAP_LOG" "$R/bootstrap.log"' EXIT
          python3 -m venv "$RUNNER_TEMP/a7-a8-ui-venv"
          "$RUNNER_TEMP/a7-a8-ui-venv/bin/pip" install --disable-pip-version-check PyYAML==6.0.3 >> "$BOOTSTRAP_LOG" 2>&1
          chmod +x .prove-it/runs/ci-a7-a8-ui-input/baseline/bin/meada-*
          cp target/debug/meada .prove-it/runs/ci-a7-a8-ui-input/meada-ui
          "$RUNNER_TEMP/a7-a8-ui-venv/bin/python" .claude/skills/prove-meada/scripts/a7-a8-audit.py ui-check \
            --baseline .prove-it/runs/ci-a7-a8-ui-input/baseline --head-bin .prove-it/runs/ci-a7-a8-ui-input/meada-ui \
            --ui-dir ui/dist --console-graph "$CONSOLE_GRAPH_RESULT" --run "$R" >> "$BOOTSTRAP_LOG" 2>&1
      - name: Retain separately bound UI supplemental evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: a7-a8-ui
          path: .prove-it/runs/ci-a7-a8-ui
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Capture pinned corpus, console API and viewer for separate source judgment
        if: always()
        env:
          PROVE_NODE: ${{ runner.temp }}/console-graph-node
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          R=.prove-it/runs/ci-a7-a8-scope
          BOOTSTRAP_LOG="$RUNNER_TEMP/a7-a8-scope-bootstrap.log"
          touch "$BOOTSTRAP_LOG"
          trap 'mkdir -p "$R"; cp "$BOOTSTRAP_LOG" "$R/bootstrap.log"' EXIT
          "$RUNNER_TEMP/a7-a8-ui-venv/bin/python" .claude/skills/prove-meada/scripts/a7-a8-audit.py scope-check \
            --baseline .prove-it/runs/ci-a7-a8-ui-input/baseline --head-bin .prove-it/runs/ci-a7-a8-ui/bin/meada-ui \
            --ui-dir .prove-it/runs/ci-a7-a8-ui/frontend --run "$R" >> "$BOOTSTRAP_LOG" 2>&1
      - name: Retain separately bound corpus, API and viewer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: a7-a8-scope
          path: .prove-it/runs/ci-a7-a8-scope
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Retain console graph evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: console-infrastructure-graph
          path: .prove-it/runs/ci-console-graph
          include-hidden-files: true
          if-no-files-found: warn

  prove-meada:
    needs: [e2e-scope, e2e-frontend]
    if: >-
      always() && !cancelled() && needs.e2e-scope.result == 'success' &&
      needs.e2e-scope.outputs.e2e == 'true' &&
      (needs.e2e-scope.outputs.console != 'true' || needs.e2e-frontend.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '2'
      PROVE_BASE: ${{ needs.e2e-scope.outputs.base }}
      PROVE_HEAD: ${{ needs.e2e-scope.outputs.head }}
      PROVE_REPOS: ${{ needs.e2e-scope.outputs.repos }}
      PROVE_CLI: ${{ needs.e2e-scope.outputs.cli }}
      PROVE_CONSOLE: ${{ needs.e2e-scope.outputs.console }}
      PROVE_ACCOUNTS: ${{ needs.e2e-scope.outputs.accounts }}
      PROVE_DEPLOY: ${{ needs.e2e-scope.outputs.deploy }}
      PROVE_CONTAINER: ${{ needs.e2e-scope.outputs.container }}
      PROVE_GOLDENS: ${{ needs.e2e-scope.outputs.goldens }}
      PROVE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      MEADA_TEST_POSTGRES_URL: postgres://postgres:meada-test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.e2e-scope.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Prepare proof readers
        run: |
          echo "PROVE_RUN=$RUNNER_TEMP/prove-meada" >> "$GITHUB_ENV"
          echo "PROVE_NODE=$RUNNER_TEMP/prove-node" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/prove-venv"
          "$RUNNER_TEMP/prove-venv/bin/pip" install --disable-pip-version-check PyYAML==6.0.3
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        if: env.PROVE_DEPLOY == 'true'
        with:
          version: v3.19.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.PROVE_CONSOLE == 'true'
        with:
          name: meada-ui-${{ needs.e2e-scope.outputs.head }}
          path: ui/dist
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.PROVE_CONSOLE == 'true'
        with:
          node-version-file: ui/.nvmrc
      - name: Prepare browser proof tools
        if: env.PROVE_CONSOLE == 'true'
        run: |
          npm install --prefix "$PROVE_NODE" --no-audit --no-fund playwright-core@1.61.1 axe-core@4.12.1
          "$PROVE_NODE/node_modules/.bin/playwright-core" install --with-deps chromium
      - name: Start the accounts proof database
        if: env.PROVE_ACCOUNTS == 'true'
        run: |
          docker run -d --name zz-prove-postgres -p 5432:5432 -e POSTGRES_PASSWORD=meada-test postgres:15-alpine
          timeout 60 bash -c 'until docker exec zz-prove-postgres pg_isready -U postgres; do sleep 1; done'
      - name: Capture selected behavior against the PR base
        id: capture
        run: '"$RUNNER_TEMP/prove-venv/bin/python" scripts/prove-ci'
      - name: Prove HTTP through Services, Compose and Ingress
        if: always() && !cancelled() && env.PROVE_CLI == 'true' && steps.capture.outcome != 'skipped'
        run: |
          "$RUNNER_TEMP/prove-venv/bin/python" .claude/skills/prove-meada/scripts/http-iac.py \
            --head-bin "$PROVE_RUN/bin/meada-head" --run .prove-it/runs/ci-http-iac
      - name: Retain HTTP infrastructure evidence
        if: always() && env.PROVE_CLI == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: http-infrastructure
          path: .prove-it/runs/ci-http-iac
          include-hidden-files: true
          if-no-files-found: warn
      - name: Prove HTTP routes declared in IaC
        if: always() && !cancelled() && env.PROVE_CLI == 'true' && steps.capture.outcome != 'skipped'
        run: |
          "$RUNNER_TEMP/prove-venv/bin/python" .claude/skills/prove-meada/scripts/iac-http-routes.py \
            --head-bin "$PROVE_RUN/bin/meada-head" --run .prove-it/runs/ci-iac-http-routes
      - name: Retain IaC HTTP route evidence
        if: always() && env.PROVE_CLI == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: iac-http-routes
          path: .prove-it/runs/ci-iac-http-routes
          include-hidden-files: true
          if-no-files-found: warn
      - name: Prove the console infrastructure graph
        if: always() && !cancelled() && env.PROVE_CONSOLE == 'true' && steps.capture.outcome != 'skipped'
        run: |
          "$RUNNER_TEMP/prove-venv/bin/python" .claude/skills/prove-meada/scripts/console-graph.py \
            --head-bin "$PROVE_RUN/bin/meada-head-ui" --ui-dir ui/dist \
            --run .prove-it/runs/ci-console-graph
      - name: Retain console graph evidence
        if: always() && env.PROVE_CONSOLE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: console-infrastructure-graph
          path: .prove-it/runs/ci-console-graph
          include-hidden-files: true
          if-no-files-found: warn
      - name: Stop the accounts proof database
        if: always() && env.PROVE_ACCOUNTS == 'true'
        run: docker rm -f zz-prove-postgres
      - name: Retain evidence and failures (capture is not PROVED)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: prove-meada-${{ github.event.pull_request.number }}-${{ needs.e2e-scope.outputs.head }}
          path: |
            ${{ runner.temp }}/prove-meada/receipt.json
            ${{ runner.temp }}/prove-meada/*.md
            ${{ runner.temp }}/prove-meada/logs
            ${{ runner.temp }}/prove-meada/queries
            ${{ runner.temp }}/prove-meada/base
            ${{ runner.temp }}/prove-meada/head
            ${{ runner.temp }}/prove-meada/http
            ${{ runner.temp }}/prove-meada/console
            ${{ runner.temp }}/prove-meada/console-api/*/console
            ${{ runner.temp }}/prove-meada/deploy
            ${{ runner.temp }}/prove-meada/bin/*.from
            !${{ runner.temp }}/prove-meada/console/private.pem
            !${{ runner.temp }}/prove-meada/console/indexes
            !${{ runner.temp }}/prove-meada/console-api/*/console/private.pem
            !${{ runner.temp }}/prove-meada/console-api/*/console/indexes
            !${{ runner.temp }}/prove-meada/http/**/indexes
          if-no-files-found: warn
          retention-days: 30
