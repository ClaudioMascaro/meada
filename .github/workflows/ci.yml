name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# rustup, preinstalled on the runners, installs the toolchain `rust-toolchain.toml` pins on the
# first cargo command. The image is pinned: `ubuntu-latest` moves to 26.04 from 2026-10-19
# (actions/runner-images#14748), and a new image is a change of its own.
jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked

  # Cloud modules (ADR 0012): every feature, against a local Valkey and S3-compatible server.
  cloud:
    runs-on: ubuntu-24.04
    services:
      valkey:
        # 7.2 is the oldest Valkey ADR 0012 supports.
        image: valkey/valkey:7.2-alpine
        ports:
          - 6379:6379
      s3:
        image: rustfs/rustfs:1.0.1
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: meada-test
          RUSTFS_SECRET_KEY: meada-test-secret
    env:
      MEADA_TEST_VALKEY_URL: redis://127.0.0.1:6379
      MEADA_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      MEADA_TEST_SERVICES_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Default build carries no module crate
        # bash with pipefail, so a failing `cargo tree` fails the step.
        shell: bash
        run: |
          # Each module ticket adds the crates its feature brings, space-separated. The list
          # holds canaries: crates specific to a module's client. Generic ones its feature also
          # pulls (fastrand, ryu, parking) may enter the default build for other reasons.
          forbidden="redis arc-swap backon crc16 tokio-rustls rustls-native-certs arcstr combine xxhash-rust async-lock object_store reqwest tar aws-lc-rs aws-lc-sys quick-xml crc-fast hyper-rustls rustls-platform-verifier filetime nix jsonwebtoken rsa p256 p384 ed25519-dalek pem simple_asn1"
          crates=$(cargo tree --locked -e normal --prefix none --format '{p}' | cut -d' ' -f1 | sort -u)
          status=0
          for c in $forbidden; do
            if grep -qx "$c" <<<"$crates"; then echo "default build lists $c"; status=1; fi
          done
          exit $status
      - name: Wait for the services
        run: |
          for port in 6379 9000; do
            timeout 60 bash -c "until (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null; do sleep 1; done"
          done
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  # The standalone frontend gate (ADR 0014). Rust contributors need neither Node nor wasm-pack.
  # Keep the core dependency boundaries here beside its browser build.
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: rustup target add wasm32-unknown-unknown
      - name: meada-core carries none of the binary's crates
        shell: bash
        run: |
          crates=$(cargo tree --locked -p meada-core -e normal --all-features --target all --prefix none --format '{p}' | cut -d' ' -f1 | sort -u)
          forbidden=$(grep -xE 'rusqlite|libsqlite3-sys|tree-sitter.*|tokio|async-std|smol|async-executor|object_store|reqwest|redis|ureq|nix|hyper' <<<"$crates" || true)
          if [ -n "$forbidden" ]; then echo "meada-core lists: $forbidden"; exit 1; fi
      - name: No build of the binary carries wasm-bindgen
        shell: bash
        run: |
          if cargo tree --locked -p meada -e normal --all-features --target all --prefix none --format '{p}' | cut -d' ' -f1 | grep -qx wasm-bindgen; then
            echo "meada lists wasm-bindgen"; exit 1
          fi
      - run: cargo build --locked -p meada-core --target wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          version=v0.15.0
          sha256=c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
          archive=$RUNNER_TEMP/wasm-pack.tar.gz
          curl -sSfL -o "$archive" "https://github.com/wasm-bindgen/wasm-pack/releases/download/$version/wasm-pack-$version-x86_64-unknown-linux-musl.tar.gz"
          echo "$sha256  $archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/wasm-pack"
          tar -xzf "$archive" -C "$RUNNER_TEMP/wasm-pack"
          install -m 755 "$(find "$RUNNER_TEMP/wasm-pack" -type f -name wasm-pack)" "$HOME/.cargo/bin/"
          wasm-pack --version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run wasm
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: npm run check:version
        working-directory: ui
      - run: npm test
        working-directory: ui

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No em dash (U+2014) in Markdown
        run: |
          ! git grep -n "$(printf '\342\200\224')" -- '*.md'
