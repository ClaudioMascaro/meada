name: CI

on:
  # Only these events run the required gates (ADR 0010): an E2E label, a ready-for-review flip or
  # a manual proof would otherwise post a newer, skipped check of the same name over a failure.
  # `proof.yml` owns those events, with job names of its own.
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    # loop/**: the backlog loop's ticket branches, where this run is the gate before the merge.
    branches: [main, 'loop/**']

# A newer push to a loop branch supersedes its run in progress; main and pull requests keep every run.
concurrency:
  group: ci-${{ github.ref }}-integration
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/loop/') }}

env:
  CARGO_TERM_COLOR: always
  # CPU-heavy reader probes share the runner; bound their concurrent test count.
  RUST_TEST_THREADS: '2'

permissions:
  contents: read

# rustup, preinstalled on the runners, installs the toolchain `rust-toolchain.toml` pins on the
# first cargo command. The image is pinned: `ubuntu-latest` moves to 26.04 from 2026-10-19
# (actions/runner-images#14748), and a new image is a change of its own.
jobs:
  changes:
    runs-on: ubuntu-24.04
    # E2E selection is the Proof workflow's (`proof.yml`): only the routine flags leave this job.
    outputs:
      routine: ${{ steps.scope.outputs.routine }}
      product: ${{ steps.scope.outputs.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select routine gates
        id: scope
        run: python3 scripts/check --ci
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        if: steps.scope.outputs.deploy == 'true' && steps.scope.outputs.product == 'true'
        with:
          version: v3.19.0
      - name: Check the verification harness and documentation
        if: steps.scope.outputs.routine == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/check-venv"
          "$RUNNER_TEMP/check-venv/bin/pip" install --disable-pip-version-check PyYAML==6.0.3
          "$RUNNER_TEMP/check-venv/bin/python" scripts/check --selftest
          "$RUNNER_TEMP/check-venv/bin/python" scripts/prove-ci --selftest
          "$RUNNER_TEMP/check-venv/bin/python" scripts/check --static

  fmt:
    needs: changes
    if: needs.changes.outputs.routine == 'true' && needs.changes.outputs.product == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --check

  clippy:
    needs: changes
    if: needs.changes.outputs.routine == 'true' && needs.changes.outputs.product == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --all-targets -- -D warnings

  # Each cloud feature builds alone (ADR 0012), and in the pairs the code gates on. Clippy only:
  # the tests need services, and the `cloud` job runs them with `--all-features`.
  clippy-features:
    needs: changes
    if: needs.changes.outputs.routine == 'true' && needs.changes.outputs.product == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features:
          - snapshot
          - valkey
          - generation-pointer
          - refresh-lock
          - oidc
          - ui
          - postgres
          - directory
          - github-app
          - workspaces
          - proposals
          - accounts
          - postgres,oidc
          - ui,directory
          - ui,oidc
          - github-app,postgres,oidc,refresh-lock
          - directory,oidc
          - directory,refresh-lock
          - postgres,refresh-lock
          - generation-pointer,postgres
          - oidc,generation-pointer
          - ui,refresh-lock
          - github-app,refresh-lock
          - workspaces,accounts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --all-targets --features ${{ matrix.features }} -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.routine == 'true' && needs.changes.outputs.product == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked

  benchmark:
    needs: changes
    if: needs.changes.outputs.routine == 'true' && needs.changes.outputs.product == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Measure public fixtures
        env:
          MEADA_BENCH_OUT: ${{ runner.temp }}/meada-benchmark
        run: env -u LD_PRELOAD cargo test --locked --release --test it benchmark::records_public_fixture_benchmark -- --ignored --exact --nocapture
      - name: Summarize measurements
        if: always()
        env:
          MEADA_BENCH_OUT: ${{ runner.temp }}/meada-benchmark
        run: |
          if [ -f "$MEADA_BENCH_OUT/summary.md" ]; then
            cat "$MEADA_BENCH_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-fixture-benchmark
          path: ${{ runner.temp }}/meada-benchmark
          if-no-files-found: error

  # Cloud modules (ADR 0012): every feature, against a local Valkey and S3-compatible server.
  cloud:
    needs: changes
    if: needs.changes.outputs.routine == 'true' && needs.changes.outputs.product == 'true'
    runs-on: ubuntu-24.04
    # scripts/test-services mirrors these services and env; tests/it/test_services.rs keeps them in step.
    services:
      valkey:
        # 7.2 is the oldest Valkey ADR 0012 supports.
        image: valkey/valkey:7.2-alpine
        ports:
          - 6379:6379
      s3:
        image: rustfs/rustfs:1.0.1
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: meada-test
          RUSTFS_SECRET_KEY: meada-test-secret
      postgres:
        # 15 is the oldest Postgres ADR 0016 supports.
        image: postgres:15-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: meada-test
    env:
      MEADA_TEST_VALKEY_URL: redis://127.0.0.1:6379
      MEADA_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      MEADA_TEST_POSTGRES_URL: postgres://postgres:meada-test@127.0.0.1:5432/postgres
      # The second Postgres, over TLS (#483), that the step "Postgres over TLS" starts.
      MEADA_TEST_POSTGRES_TLS_URL: postgres://postgres:meada-test@127.0.0.1:5433/postgres
      MEADA_TEST_SERVICES_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Postgres over TLS
        # SCRAM's channel binding (#483) needs a Postgres with TLS, which a service container
        # cannot be given a certificate for: a second one on 5433, started early so its initdb
        # overlaps the steps before the wait. The CA signs with SHA-384, so the binding's hash is
        # not SHA-256.
        # The key belongs to the image's `postgres` user (uid 70), as Postgres requires.
        shell: bash
        run: |
          dir="$RUNNER_TEMP/postgres-tls"
          mkdir -p "$dir" && cd "$dir"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-384 -sha384 -nodes -days 2 \
            -subj /CN=meada-test-ca -keyout ca.key -out ca.pem
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj /CN=127.0.0.1 \
            -keyout server.key -out server.csr
          printf 'subjectAltName=IP:127.0.0.1\nbasicConstraints=CA:FALSE\n' > server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -sha384 \
            -days 2 -extfile server.ext -out server.pem
          sudo chown 70:70 server.key server.pem
          sudo chmod 600 server.key
          docker run -d --name postgres-tls -p 5433:5432 -e POSTGRES_PASSWORD=meada-test \
            -v "$dir:/tls:ro" postgres:15-alpine \
            -c ssl=on -c ssl_cert_file=/tls/server.pem -c ssl_key_file=/tls/server.key
          echo "MEADA_TEST_POSTGRES_TLS_CA=$dir/ca.pem" >> "$GITHUB_ENV"
      - name: Default build carries no module crate
        # bash with pipefail, so a failing `cargo tree` fails the step.
        shell: bash
        run: |
          # Each module ticket adds the crates its feature brings, space-separated. The list
          # holds canaries: crates specific to a module's client. Generic ones its feature also
          # pulls (fastrand, ryu, parking) may enter the default build for other reasons.
          forbidden="redis arc-swap backon crc16 tokio-rustls rustls-native-certs arcstr combine xxhash-rust async-lock object_store reqwest tar aws-lc-rs aws-lc-sys quick-xml crc-fast hyper-rustls rustls-platform-verifier filetime nix jsonwebtoken rsa p256 p384 ed25519-dalek pem simple_asn1 tokio-postgres postgres-protocol postgres-types stringprep whoami phf argon2 password-hash blake2"
          crates=$(cargo tree --locked -e normal --prefix none --format '{p}' | cut -d' ' -f1 | sort -u)
          status=0
          for c in $forbidden; do
            if grep -qx "$c" <<<"$crates"; then echo "default build lists $c"; status=1; fi
          done
          exit $status
      - name: No Kotlin grammar crate beside the vendored one
        # ADR 0017: every Kotlin grammar exports `tree_sitter_kotlin`, and the linker keeps one
        # silently. The lock covers every feature and dependency kind.
        run: "! grep -q '^name = \"tree-sitter-kotlin' Cargo.lock"
      - name: Wait for the services
        run: |
          for port in 6379 9000 5432; do
            timeout 60 bash -c "until (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null; do sleep 1; done"
          done
          timeout 60 bash -c "until docker exec postgres-tls pg_isready -h 127.0.0.1 >/dev/null; do sleep 1; done" \
            || { docker logs postgres-tls; exit 1; }
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  # The standalone frontend gate (ADR 0014). Rust contributors need neither Node nor wasm-pack.
  # Keep the core dependency boundaries here beside its browser build.
  frontend:
    needs: changes
    if: needs.changes.outputs.routine == 'true' && needs.changes.outputs.product == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: rustup target add wasm32-unknown-unknown
      - name: meada-core carries none of the binary's crates
        shell: bash
        run: |
          crates=$(cargo tree --locked -p meada-core -e normal --all-features --target all --prefix none --format '{p}' | cut -d' ' -f1 | sort -u)
          forbidden=$(grep -xE 'rusqlite|libsqlite3-sys|tree-sitter.*|tokio|async-std|smol|async-executor|object_store|reqwest|redis|ureq|nix|hyper' <<<"$crates" || true)
          if [ -n "$forbidden" ]; then echo "meada-core lists: $forbidden"; exit 1; fi
      - name: No build of the binary carries wasm-bindgen
        shell: bash
        run: |
          if cargo tree --locked -p meada -e normal --all-features --target all --prefix none --format '{p}' | cut -d' ' -f1 | grep -qx wasm-bindgen; then
            echo "meada lists wasm-bindgen"; exit 1
          fi
      - run: cargo build --locked -p meada-core --target wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          version=v0.15.0
          sha256=c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
          archive=$RUNNER_TEMP/wasm-pack.tar.gz
          curl -sSfL -o "$archive" "https://github.com/wasm-bindgen/wasm-pack/releases/download/$version/wasm-pack-$version-x86_64-unknown-linux-musl.tar.gz"
          echo "$sha256  $archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/wasm-pack"
          tar -xzf "$archive" -C "$RUNNER_TEMP/wasm-pack"
          install -m 755 "$(find "$RUNNER_TEMP/wasm-pack" -type f -name wasm-pack)" "$HOME/.cargo/bin/"
          wasm-pack --version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run wasm
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: npm run check:version
        working-directory: ui
      - run: npm test
        working-directory: ui

  docs:
    needs: changes
    if: needs.changes.outputs.routine == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No em dash (U+2014) in Markdown
        run: |
          ! git grep -n "$(printf '\342\200\224')" -- '*.md'
