apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: amber
spec:
  template:
    metadata:
      labels: {app: proof}
    spec:
      containers:
        - name: server
          image: example/proof:v1
          envFrom:
            - configMapRef:
                name: cfg
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: amber
spec:
  selector: {app: proof}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cfg
  namespace: cobalt
data: {message: other-namespace}
---
apiVersion: proof.example.org/v1
kind: Widget
metadata:
  name: loose
spec: {note: uncontracted}
