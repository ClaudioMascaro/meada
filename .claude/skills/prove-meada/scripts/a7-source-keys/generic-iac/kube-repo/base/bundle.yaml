apiVersion: v1
kind: Namespace
metadata:
  name: seed
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: seed
spec:
  template:
    metadata:
      labels:
        app: proof
    spec:
      serviceAccountName: sa
      containers:
        - name: server
          image: example/proof:v1
          env:
            - name: SETTINGS
              valueFrom:
                configMapKeyRef:
                  name: cfg
                  key: message
            - name: CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: cred
                  key: token
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: seed
spec:
  selector:
    app: proof
  ports:
    - port: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa
  namespace: seed
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cfg
  namespace: seed
data:
  message: proof-cfg
---
apiVersion: v1
kind: Secret
metadata:
  name: cred
  namespace: seed
stringData:
  token: proof-private-token
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edge
  namespace: seed
spec:
  rules:
    - host: proof.example.invalid
      http:
        paths:
          - path: /proof
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
