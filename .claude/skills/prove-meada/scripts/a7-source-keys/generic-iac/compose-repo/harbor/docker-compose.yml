services:
  api:
    image: example/proof-api:${BRANCH}
    build: ../../escape
    depends_on:
      store:
        condition: service_started
      missing:
        condition: service_started
    links: [store:db, missing:absent]
    networks: [edge]
  store:
    image: ${STORE_IMAGE:-redis:7}
    build: ${CONTEXT}
    networks: [edge]
  observer:
    image: alpine:3
    build: ./source
    networks: {}
  drifter:
    image: alpine:3
  watcher:
    image: alpine:3
  hoster:
    image: alpine:3
    network_mode: host
networks:
  edge: {}
