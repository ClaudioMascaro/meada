AWSTemplateFormatVersion: "2010-09-09"
Description: Plain CloudFormation with parameters
Parameters:
  Environment:
    Type: String
    Default: prod
  DbPassword:
    Type: String
    NoEcho: true
    Default: hunter2
  Retention:
    Type: Number
    Default: 14
  PasswordYes:
    Type: String
    NoEcho: yes
    Default: zzleakyes
  QueueKey:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /app/queue-name
  Zones:
    Type: CommaDelimitedList
    Default: "a,b"
  Bare:
    Type: String
Resources:
  JobsQueue:
    Type: AWS::SQS::Queue
    DependsOn:
      - JobsDeadLetter
      - AlertsTopic
    Properties:
      QueueName: !Sub "${Environment}-jobs"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobsDeadLetter.Arn
        maxReceiveCount: 5
  JobsDeadLetter:
    Type: AWS::SQS::Queue
    Properties:
      QueueName:
        Fn::Join:
          - "-"
          - - !Ref Environment
            - jobs
            - dead
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alerts"
      Subscription:
        - Protocol: sqs
          Endpoint: !GetAtt JobsQueue.Arn
  AssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Join ["-", [assets, !Ref Environment, !Ref "AWS::Region"]]
  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${Environment}-db"
      MasterUserPassword: !Ref DbPassword
  Secrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${Environment}/${Bare}/${DbPassword}"
  QueueLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub
        - "/aws/${Environment}/${Shard}"
        - Shard: "0"
      RetentionInDays: !Ref Retention
      Tags:
        - Key: queue
          Value: !Sub "${JobsQueue.QueueName}"
  Imported:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !ImportValue shared-parameter-name
      Type: String
      Value: !Ref JobsQueue
  BucketAlias:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Ref AssetsBucket
      Type: String
      Value: alias
  ListName:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Join ["-", !Ref Zones]
  Escaped:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "literal-${!Escaped}-${Environment}"
      Type: String
      Value: x
  NoName:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 30
  Custom:
    Type: Custom::Lookup
    Properties:
      ServiceToken: !GetAtt JobsQueue.Arn
  KeyOrder:
    Properties:
      KeyOrder: !Ref JobsQueue
      Name: !Ref QueueKey
    Type: AWS::SSM::Parameter
  ComputedAttribute:
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: !GetAtt [JobsQueue, !Ref Environment]
