group = 'example'

// A name the script assigns once to a plain string reads as that string: a written coordinate,
// linked exact to its one provider.
def suffix = 'pi'
dependencies {
    implementation "example:a${suffix}"
}

// A catalog accessor and a `gradle.properties` value fill what the script leaves open.
dependencies {
    runtimeOnly libs.api
    compileOnly "${vendor}:api"
}
