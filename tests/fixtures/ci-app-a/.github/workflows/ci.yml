name: CI
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
  publish:
    needs: build
    permissions:
      id-token: write
      contents: read
    uses: acme/workflows/.github/workflows/publish.yml@main
    with:
      package: app-a
      registry: internal
    secrets: inherit
  lint:
    uses: acme/workflows/.github/workflows/lint.yml@main
  scan:
    uses: Acme/Workflows/.github/workflows/scan.yml@v2
  internal:
    uses: acme/workflows/.github/workflows/internal.yml@main
  elsewhere:
    uses: other-org/pipelines/.github/workflows/deploy.yml@v3
