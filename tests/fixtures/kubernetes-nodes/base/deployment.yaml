apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: runner
      containers:
        - name: web
          image: ghcr.io/acme/api:1.0
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: url
          envFrom:
            - configMapRef:
                name: api-settings
      volumes:
        - name: settings
          configMap:
            name: api-settings
