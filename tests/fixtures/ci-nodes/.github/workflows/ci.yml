name: CI
on:
  push:
env:
  REGISTRY: ghcr.io
jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - id: login
        name: Log in
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: acme
        env:
          MODE: release
      - name: Compile
        run: |
          make build
          make check

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: make test
  publish-prd:
    needs: [build, test]
    uses: acme/workflows/.github/workflows/publish.yml@v1
    with:
      package: app
