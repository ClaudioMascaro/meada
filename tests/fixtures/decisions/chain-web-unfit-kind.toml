# Decisions of the wrong kind for their call: the health check is no unresolved consumer, the
# tracking URL no ambiguous link.

# The call is not an unresolved consumer.
[[decision]]
kind = "dynamic-url"
call = "example.com/chain/web::src/status.ts::health::fetch#0"
target = "example.com/chain/gateway::http::GET::/api/health"
by = "human"

# The call is not an ambiguous link.
[[decision]]
kind = "ambiguous-link"
call = "example.com/chain/web::src/status.ts::track::fetch#0"
target = "example.com/chain/catalog::http::GET::/api/products/{}"
by = "human"
