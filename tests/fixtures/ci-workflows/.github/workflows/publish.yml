name: Publish
on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
    secrets:
      token:
        required: false
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo publish ${{ inputs.package }}
