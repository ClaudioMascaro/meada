apiVersion: s3.aws.upbound.io/v1beta1
kind: Bucket
metadata:
  name: shared-assets
  annotations:
    crossplane.io/external-name: acme-shared-assets
spec:
  forProvider:
    region: us-east-1
  providerConfigRef:
    name: default
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: buckets.s3.aws.upbound.io
spec:
  group: s3.aws.upbound.io
  names:
    kind: Bucket
    plural: buckets
  scope: Cluster
