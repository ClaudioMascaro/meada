apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: rabbit-stack
spec:
  compositeTypeRef:
    apiVersion: platform.example.com/v1
    kind: Messaging
  resources:
  - name: queue
    base:
      apiVersion: rabbitmq.com/v1beta1
      kind: Queue
      spec:
        rabbitmqClusterReference:
          name: broker
        vhost: /
        name: composed-inbox
  - name: exchange
    base:
      apiVersion: rabbitmq.com/v1beta1
      kind: Exchange
      spec:
        rabbitmqClusterReference:
          name: broker
        vhost: /
        name: composed-exchange
        type: topic
  - name: binding
    base:
      apiVersion: rabbitmq.com/v1beta1
      kind: Binding
      spec:
        rabbitmqClusterReference:
          name: broker
        vhost: /
        source: composed-exchange
        destination: composed-inbox
        destinationType: queue
        routingKey: order.created
  - name: patched-binding
    base:
      apiVersion: rabbitmq.com/v1beta1
      kind: Binding
      spec:
        rabbitmqClusterReference:
          name: broker
        vhost: /
        source: composed-exchange
        destination: composed-inbox
        destinationType: queue
        routingKey: order.created
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.source
      toFieldPath: spec.source
