apiVersion: v1
kind: Pod
metadata: {name: sdk-values}
spec:
  containers:
    - name: plain
      image: ghcr.io/probe/azure-sdk-worker:v1
      env:
        - {name: HUB, value: events-env}
        - {name: CONTAINER, value: uploads-env}
        - name: PRIVATE_SECRET
          valueFrom: {secretKeyRef: {name: private-selector, key: selector}}
        - {name: SECRET, value: token-env}
        - {name: WRONG, value: /subscriptions/s/resourceGroups/g/providers/Microsoft.ServiceBus/namespaces/n/queues/wrong}
    - name: structured
      image: ghcr.io/probe/azure-sdk-worker:v1
      env:
        - {name: HUB, value: /subscriptions/s/resourceGroups/g/providers/Microsoft.EventHub/namespaces/n/eventhubs/events-env}
        - {name: CONTAINER, value: 'https://account.blob.core.windows.net/uploads-env/object'}
        - name: PRIVATE_SECRET
          valueFrom: {secretKeyRef: {name: private-selector, key: selector}}
        - {name: SECRET, value: 'https://keys.vault.azure.net/secrets/token-env/version'}
        - {name: WRONG, value: /subscriptions/s/resourceGroups/g/providers/Microsoft.ServiceBus/namespaces/n/queues/wrong}
---
apiVersion: v1
kind: Secret
metadata: {name: private-selector}
stringData: {selector: private-selector-canary-670}
