apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: shop
  labels:
    app.kubernetes.io/name: app
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: app
          image: ghcr.io/acme/app:1.4.2
          env:
            - name: LOG_LEVEL
              value: debug
---
apiVersion: v1
kind: Secret
metadata:
  name: app-db
  namespace: shop
type: Opaque
data:
  password: c2VjcmV0LXBhc3N3b3Jk
stringData:
  username: app-admin
  port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: shop
spec:
  selector:
    app.kubernetes.io/name: app
  ports:
    - port: 80
