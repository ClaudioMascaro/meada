apiVersion: v1
kind: ConfigMap
metadata:
  name: queues
  namespace: shop
data:
  queue: https://sqs.us-east-1.amazonaws.com/123456789012/orders
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sender
  namespace: shop
spec:
  template:
    spec:
      containers:
        - name: sender
          image: ghcr.io/acme/environment-app:v1
          env:
            - name: QUEUE_URL
              valueFrom:
                configMapKeyRef:
                  name: queues
                  key: queue
