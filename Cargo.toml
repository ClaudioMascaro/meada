[package]
name = "meada"
version = "0.1.0"
edition = "2024"
description = "LLM-free code graph that links repositories through the contracts they share, served over MCP"
license = "Apache-2.0"
repository = "https://github.com/ClaudioMascaro/meada"
readme = "README.md"
keywords = ["code-graph", "mcp", "tree-sitter", "cross-repo", "code-intelligence"]
categories = ["development-tools", "command-line-utilities"]
exclude = [".github/", "AGENTS.md", "CLAUDE.md", "dist-workspace.toml"]

[dependencies]
# The transport guard of the snapshot store (ADR 0012), only behind `snapshot`: object_store's
# `HttpService` is an `async_trait`.
async-trait = { version = "=0.1.92", optional = true }
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
# A bundle's download as a stream (`meada snapshot pull`), only behind `snapshot`. rmcp already
# brings it into the default build, so it is no canary of the module.
futures = { version = "0.3.34", optional = true, default-features = false, features = ["std"] }
# The listener under rmcp's streamable HTTP server, which is a service with none (server mode).
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
ignore = "0.4.33"
nodejs-semver = "7"
# The snapshot store's S3 client (ADR 0012), only behind `snapshot`: no default features (no
# local file store), the `aws` client with ring for its signatures. `aws` itself would bring
# aws-lc-rs, a second rustls provider beside ring, and rustls then panics on the first TLS
# connection of a build with every module.
object_store = { version = "=0.14.2", optional = true, default-features = false, features = [
    "aws-base",
    "reqwest",
    "ring",
] }
percent-encoding = "2.3.2"
# The Valkey client of the cloud modules (ADR 0012), only behind the internal `valkey` feature.
# Default features off: no native-tls, only rustls.
redis = { version = "=1.7.1", optional = true, default-features = false, features = [
    "tokio-rustls-comp",
    "cluster-async",
    "connection-manager",
] }
# The HTTP client under object_store, built by the snapshot module itself: no redirect, no proxy,
# and rustls with no provider of its own: the module hands it a ring configuration.
reqwest = { version = "=0.13.5", optional = true, default-features = false, features = [
    "rustls-no-provider",
] }
rmcp = { version = "3.5.1", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
# The snapshot store's TLS configuration, only behind `snapshot`: ring, the one rustls provider
# of every build (ureq and redis use it too), and the system's roots.
rustls = { version = "0.23.46", optional = true, default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
rustls-platform-verifier = { version = "0.7.1", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The snapshot store's bundles (ADR 0012), only behind `snapshot`: no extended attributes.
tar = { version = "=0.4.45", optional = true, default-features = false }
toml = "1.1.8"
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tree-sitter = "0.27.1"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
yaml-rust2 = { version = "0.13.0", default-features = false }

# Cloud modules (ADR 0012), all off by default: a build without a feature carries none of its
# crates. `valkey` is internal, enabled through the modules that need it.
[features]
valkey = ["dep:redis"]
snapshot = [
    "dep:object_store",
    "dep:reqwest",
    "dep:tar",
    "dep:async-trait",
    "dep:futures",
    "dep:rustls",
    "dep:rustls-platform-verifier",
]

# `cargo test` runs the example's own tests too.
[[example]]
name = "golden_diff"
test = true

[dev-dependencies]
rmcp = { version = "3.5.1", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
