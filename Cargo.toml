[workspace]
members = [".", "meada-core"]
default-members = [".", "meada-core"]

[workspace.package]
version = "1.6.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ClaudioMascaro/meada"

[workspace.lints.clippy]
allow_attributes = "deny"

[package]
name = "meada"
version.workspace = true
edition.workspace = true
description = "LLM-free code graph that links repositories through the contracts they share, served over MCP"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["code-graph", "mcp", "tree-sitter", "cross-repo", "code-intelligence"]
categories = ["development-tools", "command-line-utilities"]
exclude = [".github/", "AGENTS.md", "CLAUDE.md", "dist-workspace.toml"]

[lints]
workspace = true

[dependencies]
argon2 = { version = "=0.5.3", optional = true, default-features = false, features = [
    "alloc",
    "password-hash",
    "rand",
] }
password-hash = { version = "=0.5.0", optional = true, default-features = false, features = [
    "getrandom",
] }
async-trait = { version = "=0.1.92", optional = true }
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
futures = { version = "0.3.34", optional = true, default-features = false, features = ["std"] }
hcl-edit = "0.10.0"
hcl-rs = "0.20.0"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
ignore = "0.4.33"
meada-core = { path = "meada-core", version = "=2.0.0" }
jsonwebtoken = { version = "=11.1.0", optional = true, default-features = false, features = [
    "rust_crypto",
] }
miniz_oxide = "0.8.9"
nodejs-semver = "7"
object_store = { version = "=0.14.2", optional = true, default-features = false, features = [
    "aws-base",
    "reqwest",
    "ring",
] }
percent-encoding = "2.3.2"
regex = "1.13.1"
regex-syntax = "0.8.11"
redis = { version = "=1.7.1", optional = true, default-features = false, features = [
    "tokio-rustls-comp",
    "cluster-async",
    "connection-manager",
] }
reqwest = { version = "=0.13.5", optional = true, default-features = false, features = [
    "rustls-no-provider",
] }
rmcp = { version = "3.5.1", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
rustls = { version = "0.23.46", optional = true, default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
rustls-platform-verifier = { version = "0.7.1", optional = true }
ring = { version = "0.17.14", optional = true }
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = { version = "=0.4.46", optional = true, default-features = false }
toml = "1.1.8"
tokio-postgres = { version = "=0.7.18", optional = true, default-features = false }
tokio-rustls = { version = "0.26.6", optional = true, default-features = false, features = [
    "ring",
] }
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tree-sitter = "0.27.1"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-language = "0.1.9"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.4"
tree-sitter-typescript = "0.23.2"
unicode-normalization = "0.1.26"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
yaml-rust2 = { version = "0.13.0", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", optional = true, default-features = false, features = ["signal", "hostname", "user"] }

[features]
valkey = ["dep:redis"]
snapshot = [
    "dep:object_store",
    "dep:reqwest",
    "dep:tar",
    "dep:async-trait",
    "dep:futures",
    "dep:rustls",
    "dep:rustls-platform-verifier",
]
generation-pointer = ["snapshot", "valkey", "dep:nix"]
refresh-lock = ["generation-pointer"]
oidc = ["dep:jsonwebtoken", "ureq/platform-verifier"]
github-app = ["valkey", "dep:jsonwebtoken", "jsonwebtoken/use_pem", "ureq/platform-verifier"]
postgres = [
    "dep:tokio-postgres",
    "dep:tokio-rustls",
    "dep:ring",
    "dep:rustls",
    "dep:rustls-platform-verifier",
]
directory = ["postgres"]
ui = []
workspaces = [
    "ui",
    "oidc",
    "postgres",
    "github-app",
    "generation-pointer",
    "refresh-lock",
]
proposals = ["workspaces"]
accounts = [
    "ui",
    "oidc",
    "postgres",
    "dep:argon2",
    "dep:password-hash",
    "jsonwebtoken/use_pem",
]
cloud = [
    "snapshot",
    "generation-pointer",
    "refresh-lock",
    "oidc",
    "github-app",
    "ui",
    "postgres",
    "directory",
    "workspaces",
    "proposals",
    "accounts",
]

[[example]]
name = "golden_diff"
test = true

[[example]]
name = "split_agents"
test = true

[build-dependencies]
cc = "1.8.0"

[dev-dependencies]
ring = "0.17.14"
rmcp = { version = "3.5.1", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }

[profile.dist]
inherits = "release"
lto = "thin"

[profile.dev.package.meada]
opt-level = 1

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3
