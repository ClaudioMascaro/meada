index_dir = "/var/lib/meada/indexes"

[workspace]
source = "store"

[snapshot]
endpoint = "https://store:9000"
region = "us-east-1"
bucket = "meada-compose"
prefix = "prod"
path_style = true
credentials = "static"
access_key_id_env = "AWS_ACCESS_KEY_ID"
secret_access_key_env = "AWS_SECRET_ACCESS_KEY"
ca_file = "/etc/meada/ca/ca.pem"
local_dir = "/var/lib/meada/generations"

[valkey]
url = "rediss://meada@valkey:6379"
password_env = "VALKEY_PASSWORD"
key_prefix = "meada:compose"
ca_file = "/etc/meada/ca/ca.pem"

[generations]
keep = 3

[refresh_lock]
ttl_seconds = 300

# Identity automation (ADR 0016), with compose.postgres.yaml. Uncomment these sections to run the
# role check: the refresh then runs `meada github-app roles` after `meada workspace pull` and
# fetches the mirrors that `meada workspace show --pulled` lists. Also export MEADA_GITHUB_APP_KEY
# (or give the job git credentials) and set the login claim your identity provider issues.
# [postgres]
# url_env = "MEADA_POSTGRES_URL"
# ca_file = "/etc/meada/ca/ca.pem"
#
# [oidc]
# issuer = "https://id.example.internal/realms/agents"
# public_url = "https://localhost:8443"
#
# [oidc.github]
# login_claim = "github_login"
# max_age_seconds = 5400     # the job's schedule plus its longest run
#
# [[github_app]]
# host = "github.com"
# api = "https://api.github.com"
# app_id = 123456
# private_key_env = "MEADA_GITHUB_APP_KEY"
