# Opt in with compose.yaml, compose.console.yaml, compose.postgres.yaml and this file, and both
# --profile generations and --profile console:
#   docker compose -f compose.yaml -f compose.console.yaml -f compose.postgres.yaml \
#     -f compose.proposals.yaml --profile generations --profile console
# It adds the proposal server (`meada workspaces mcp`, ADR 0022) as a process of its own beside the
# console and the nodes: its pull of the generation (as the nodes do, in a volume of its own), the
# server on an internal port, and a Caddy with TLS on 127.0.0.1:8445. It reads Postgres with the
# read role, every session read-only. proposals.workspace.toml holds the sections to uncomment
# before the server starts: it needs [workspaces], the GitHub grant provider and an [oidc] audience.
x-proposals: &proposals
  image: ghcr.io/claudiomascaro/meada:${MEADA_VERSION:-1.1.0}-cloud
  profiles: [console]
  hostname: proposals
  environment:
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env}
    VALKEY_PASSWORD: ${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in .env}
    MEADA_POSTGRES_READ_URL: postgres://meada_read:${POSTGRES_READ_PASSWORD:?Set POSTGRES_READ_PASSWORD in .env}@postgres:5432/meada
    # With [directory] in proposals.workspace.toml (the same as the console's): the token is read
    # to start the directory module, never served.
    MEADA_SCIM_TOKEN: ${MEADA_SCIM_TOKEN:-}
  mem_limit: 512m
  cpus: 1.0
  read_only: true

services:
  init-proposals:
    image: ghcr.io/claudiomascaro/meada:${MEADA_VERSION:-1.1.0}
    profiles: [console]
    user: "0:0"
    entrypoint: [sh, -ec]
    command: ["chown 10001:10001 /var/lib/meada/proposals"]
    volumes:
      - proposals-data:/var/lib/meada/proposals
    mem_limit: 64m

  proposals-first-pull:
    <<: *proposals
    entrypoint: [sh, /etc/meada/first-pull.sh]
    depends_on:
      init-proposals:
        condition: service_completed_successfully
      generation-indexer:
        condition: service_started
      postgres-migrate:
        condition: service_completed_successfully
    volumes:
      - ./proposals.workspace.toml:/etc/meada/meada.workspace.toml:ro
      - ./first-pull.sh:/etc/meada/first-pull.sh:ro
      - ca:/etc/meada/ca:ro
      - proposals-data:/var/lib/meada/proposals

  proposals-pull:
    <<: *proposals
    command: [snapshot, pull, --every, "30", --workspace, /etc/meada/meada.workspace.toml]
    depends_on:
      proposals-first-pull:
        condition: service_completed_successfully
    volumes:
      - ./proposals.workspace.toml:/etc/meada/meada.workspace.toml:ro
      - ca:/etc/meada/ca:ro
      - proposals-data:/var/lib/meada/proposals
    restart: unless-stopped
    stop_grace_period: 30s

  proposals:
    <<: *proposals
    command: [workspaces, mcp, --listen, "0.0.0.0:8090", --workspace, /etc/meada/meada.workspace.toml]
    depends_on:
      proposals-first-pull:
        condition: service_completed_successfully
    volumes:
      - ./proposals.workspace.toml:/etc/meada/meada.workspace.toml:ro
      - ca:/etc/meada/ca:ro
      - proposals-data:/var/lib/meada/proposals:ro
    restart: unless-stopped
    stop_grace_period: 30s

  proposals-proxy:
    image: caddy:2.11.7-alpine
    profiles: [console]
    ports:
      - "127.0.0.1:8445:443"
    depends_on:
      proposals:
        condition: service_started
    volumes:
      - ./Caddyfile.proposals:/etc/caddy/Caddyfile:ro
      - proposals-proxy-data:/data
      - proposals-proxy-config:/config
    restart: unless-stopped
    mem_limit: 128m

volumes:
  proposals-data:
  proposals-proxy-data:
  proposals-proxy-config:
