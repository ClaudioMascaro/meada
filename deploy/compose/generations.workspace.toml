index_dir = "/var/lib/meada/indexes"

[[repository]]
repo = "github.com/claudiomascaro/meada"
path = "/srv/mirrors/github.com/claudiomascaro/meada"

[snapshot]
endpoint = "https://store:9000"
region = "us-east-1"
bucket = "meada-compose"
prefix = "prod"
path_style = true
credentials = "static"
access_key_id_env = "AWS_ACCESS_KEY_ID"
secret_access_key_env = "AWS_SECRET_ACCESS_KEY"
ca_file = "/etc/meada/ca/ca.pem"
local_dir = "/var/lib/meada/generations"

[valkey]
url = "rediss://meada@valkey:6379"
password_env = "VALKEY_PASSWORD"
key_prefix = "meada:compose"
ca_file = "/etc/meada/ca/ca.pem"

[generations]
keep = 3

[refresh_lock]
ttl_seconds = 300

# Identity automation (ADR 0016), with compose.postgres.yaml. A node reads Postgres with the read
# role; [oidc.github] needs [oidc] and [postgres]. Match the console's [oidc] and [oidc.github].
