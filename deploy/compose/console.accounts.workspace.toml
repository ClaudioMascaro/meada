# The console of the local accounts proof of concept; console.workspace.toml is the other profiles'.
index_dir = "/var/lib/meada/console/indexes"

[workspace]
source = "store"

[snapshot]
endpoint = "https://store:9000"
region = "us-east-1"
bucket = "meada-compose"
prefix = "prod"
path_style = true
credentials = "static"
access_key_id_env = "AWS_ACCESS_KEY_ID"
secret_access_key_env = "AWS_SECRET_ACCESS_KEY"
ca_file = "/etc/meada/ca/ca.pem"
local_dir = "/var/lib/meada/console/generations"
node_name = "console"

[valkey]
url = "rediss://meada@valkey:6379"
password_env = "VALKEY_PASSWORD"
key_prefix = "meada:compose"
ca_file = "/etc/meada/ca/ca.pem"

[generations]
keep = 3

[refresh_lock]
ttl_seconds = 300

# Local accounts (ADR 0024, compose.accounts.yaml): the sign-in is the console's own, so there is
# no [oidc] here. The default account reads MEADA_ADMIN_PASSWORD (empty: a generated password,
# printed once on the console's stderr).
[postgres]
url_env = "MEADA_POSTGRES_URL"
ca_file = "/etc/meada/ca/ca.pem"

[accounts]
public_key_file = "/etc/meada/accounts/public.pem"
private_key_file = "/etc/meada/accounts-private/private.pem"

[ui]
dir = "/usr/share/meada/ui"
public_url = "https://localhost:8444"
client_id = "meada-console"
audience = "https://localhost:8444"
operations = true
