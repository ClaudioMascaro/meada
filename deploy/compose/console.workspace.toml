index_dir = "/var/lib/meada/console/indexes"

[workspace]
source = "store"

[snapshot]
endpoint = "https://store:9000"
region = "us-east-1"
bucket = "meada-compose"
prefix = "prod"
path_style = true
credentials = "static"
access_key_id_env = "AWS_ACCESS_KEY_ID"
secret_access_key_env = "AWS_SECRET_ACCESS_KEY"
ca_file = "/etc/meada/ca/ca.pem"
local_dir = "/var/lib/meada/console/generations"
node_name = "console"

[valkey]
url = "rediss://meada@valkey:6379"
password_env = "VALKEY_PASSWORD"
key_prefix = "meada:compose"
ca_file = "/etc/meada/ca/ca.pem"

[generations]
keep = 3

[refresh_lock]
ttl_seconds = 300

# To use OIDC, configure an issuer reachable by both browser and console, then
# uncomment this policy. Keep the MCP nodes' public URL and audience here.
# [oidc]
# issuer = "https://id.example.internal/realms/agents"
# public_url = "https://localhost:8443"
# audience = "meada-nodes"
# identities_claim = "meada_repositories"
# groups_claim = "groups"
# scopes = ["meada:read"]
# [oidc.groups]
# "meada-operators" = ["*"]
# A team: map its group to the identities it owns (docs site, console, Teams).
# "team-billing" = ["github.com/acme/billing"]

# Identity automation (ADR 0016), with compose.postgres.yaml. [postgres] reads the write role's
# URL; [oidc.github], [directory] and [oidc.entra] need [oidc] above. [directory] reads the SCIM
# token from MEADA_SCIM_TOKEN (at least 32 characters); the identity provider pushes to
# https://localhost:8444/scim/v2/ (see the identity recipes on the docs site).
# [postgres]
# url_env = "MEADA_POSTGRES_URL"
# ca_file = "/etc/meada/ca/ca.pem"
#
# [oidc.github]
# login_claim = "github_login"
# max_age_seconds = 5400
#
# [directory]
# token_env = "MEADA_SCIM_TOKEN"
# user_claim = "oid"
# user_attribute = "externalId"
# group_attribute = "externalId"
#
# Entra ID only: set type = "entra" in [oidc] above, then
# [oidc.entra]
# overage = "directory"      # needs [directory] and groups_claim

[ui]
dir = "/usr/share/meada/ui"
public_url = "https://localhost:8444"
client_id = "meada-console"
audience = "https://localhost:8444"
operations = false
# With OIDC, select at most one of these; operations needs a selector:
# operator_groups = ["meada-operators"]
# operator_claim = "meada_operator"
