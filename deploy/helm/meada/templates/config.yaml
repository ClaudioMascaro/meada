{{- include "meada.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "meada.name" . }}
  labels:
    {{- include "meada.labels" . | nindent 4 }}
data:
  fetch.sh: |
    {{- .Values.workspace.fetch | nindent 4 }}
  meada.workspace.toml: |
    {{- include "meada.nodeBootstrap" . | nindent 4 }}
  {{- if .Values.modules.githubApp.enabled }}
  job.workspace.toml: |
    {{- include "meada.nodeBootstrap" . | nindent 4 }}
    {{- with .Values.modules.githubApp }}

    [[github_app]]
    host = {{ .host | toJson }}
    api = {{ .api | toJson }}
    app_id = {{ .appId }}
    private_key_env = "MEADA_GITHUB_APP_KEY"
    {{- end }}
    {{- include "meada.namedWorkspaces" . | nindent 4 }}
    {{- include "meada.jobUi" . | nindent 4 }}
  {{- end }}
  {{- if .Values.modules.postgres.enabled }}
  postgres.workspace.toml: |
    index_dir = "/data/indexes"
    {{- with .Values.modules.postgres }}

    [postgres]
    url_env = "MEADA_POSTGRES_URL"
    schema = {{ .schema | toJson }}
    {{- if or $.Values.tls.caSecret $.Values.tls.caConfigMap }}
    ca_file = "/etc/meada-ca/ca.crt"
    {{- end }}
    {{- end }}
  {{- end }}
