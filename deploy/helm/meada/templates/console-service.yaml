{{- if .Values.console.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meada.consoleName" . }}
  labels:
    {{- include "meada.consoleLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "meada.consoleLabels" . | nindent 4 }}
  ports:
    - name: ui
      port: {{ .Values.console.service.port }}
      targetPort: ui
{{- end }}
