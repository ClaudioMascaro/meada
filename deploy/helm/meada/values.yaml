# Admission: configure your Ingress or auth proxy before exposing this service.
# Without OIDC it admits clients; a misconfigured Ingress exposes the source graph.
# With modules.oidc.enabled, pass Authorization through to Meada unchanged.
replicaCount: 2
image:
  repository: ghcr.io/claudiomascaro/meada
  tag: ""
  cloud: false
  pullPolicy: IfNotPresent
imagePullSecrets: []
listen: 7333
terminationGracePeriodSeconds: 40
preStop:
  sleepSeconds: 5
readiness:
  type: exec
  periodSeconds: 10
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
serviceAccount:
  create: true
  name: ""
  annotations: {}
service:
  port: 7333
ingress:
  enabled: false
  className: ""
  # Controller-specific admission is the operator's responsibility. Forward Authorization,
  # MCP-Protocol-Version, MCP-Session-Id, Mcp-Method, Mcp-Name and Mcp-Param-*;
  # return Meada-Generation; never add Origin.
  # Traefik: keep those headers out of customRequestHeaders/customResponseHeaders in any
  # Headers middleware, where values replace headers and an empty value removes them.
  # https://doc.traefik.io/traefik/middlewares/http/headers/
  # HAProxy Kubernetes Ingress: do not rewrite them with haproxy.org/request-set-header
  # or haproxy.org/response-set-header, and do not inject Origin in controller snippets.
  # https://github.com/haproxytech/kubernetes-ingress/blob/master/documentation/annotations.md
  annotations: {}
  host: meada.example.internal
  tls: []
workspace:
  source: file
  repositories: |
    [[repository]]
    repo = "github.com/claudiomascaro/meada"
    path = "/data/mirrors/meada"
  # Runs outside Meada. Fetch and index finish before a module-free node starts. It reads the
  # repositories from $1 when given (under modules.oidc.github, the file `meada workspace show
  # --pulled` writes), else from workspace.repositories (mounted as repositories.toml, the
  # operator's list even when workspace.source=store leaves it out of the bootstrap). A mirror
  # whose origin carries credentials is refused, and a failed fetch stops the refresh before
  # publication (#316); no line carries a URL or a token.
  fetch: |
    set -eu
    list=${1:-/etc/meada/repositories.toml}
    pairs=$(awk '
      # Reads the keys of each [[repository]] table itself: any table header ends the entry before
      # it, so a [[repository.peer]] or [[repository.resource]] table adds nothing. A value is the text
      # between its quotes. Basic strings only: an identity and a mirror path carry no literal string,
      # multi-line string or escape, and no multi-line array with a line that starts with [. The same
      # program is in deploy/compose/fetch-pulled.sh and the chart workspace.fetch (values.yaml); a
      # test fails when the two drift (#544).
      function value(line) { sub(/^[^"]*"/, "", line); sub(/".*$/, "", line); return line }
      function flush() { if (inrepo && (repo != "" || path != "")) print repo " " path; repo = ""; path = "" }
      /^[ \t]*\[/ { flush(); inrepo = ($0 ~ /^[ \t]*\[\[repository\]\]/); next }
      inrepo && /^[ \t]*repo[ \t]*=[ \t]*"/ { repo = value($0) }
      inrepo && /^[ \t]*path[ \t]*=[ \t]*"/ { path = value($0) }
      END { flush() }
    ' "$list")
    [ -n "$pairs" ] || exit 0
    while read -r identity path; do
      case "$identity" in
        *@*) echo 'REPOSITORIES takes URLs without credentials; give git a credential helper' >&2; exit 1 ;;
      esac
      case "/$identity/" in
        *//*|*/../*|*/./*) echo 'Invalid repository path' >&2; exit 1 ;;
      esac
      case "$path" in
        *//*|*/../*|*/..|*/./*|*/.) echo "refresh: the path of $identity must stay under /data/mirrors" >&2; exit 1 ;;
        /data/mirrors/?*) ;;
        *) echo "refresh: the path of $identity must stay under /data/mirrors" >&2; exit 1 ;;
      esac
      mkdir -p /data/mirrors
      if [ -d "$path/.git" ]; then
        origin=$(git -c "safe.directory=$path" -C "$path" remote get-url origin 2>/dev/null || true)
        case "$origin" in
          https://*|http://*)
            host=${origin#*://}
            case "${host%%/*}" in
              *@*) echo "refresh: the origin of $identity takes a URL without credentials; give git a credential helper" >&2; exit 1 ;;
            esac ;;
        esac
        git -c "safe.directory=$path" -C "$path" fetch --depth 1 origin HEAD &&
          git -c "safe.directory=$path" -C "$path" checkout --detach FETCH_HEAD
      else
        git clone --depth 1 -- "https://$identity.git" "$path"
      fi || {
        echo "refresh: fetch failed for $identity; the refresh stops before publication" >&2
        exit 1
      }
    done <<EOF
    $pairs
    EOF
  gitCredentialsSecret: ""
# Mounted as ca.crt: snapshot adds these roots to platform trust; Valkey uses only these roots.
tls:
  caSecret: ""
  caConfigMap: ""
modules:
  snapshot:
    enabled: false
    endpoint: https://store.example.internal
    region: us-east-1
    bucket: meada
    prefix: production/meada
    pathStyle: true
    credentials: static
    credentialsSecret: meada-store
  valkey:
    enabled: false
    url: rediss://meada@valkey.example.internal:6379
    keyPrefix: meada
    cluster: false
    credentialsSecret: meada-valkey
  generations:
    enabled: false
    keep: 3
    pullEverySeconds: 30
  refreshLock:
    enabled: false
    ttlSeconds: 300
  oidc:
    enabled: false
    issuer: https://id.example.internal/realms/agents
    publicUrl: https://meada.example.internal
    audience: ""
    identitiesClaim: meada_repositories
    groupsClaim: ""
    groups: {}
    scopes: []
    # generic (the default), entra, okta or keycloak: names the identity provider (ADR 0016).
    type: generic
    # Entra ID only (type: entra): "directory" gives a token in groups overage its groups from the
    # directory below; it needs modules.directory and groupsClaim.
    entra:
      overage: ignore
    # The GitHub grant provider: a subject reads what its GitHub login reads on GitHub. It needs
    # modules.postgres, modules.githubApp and modules.oidc. The refresh then runs
    # `meada github-app roles` and fetches from `meada workspace show --pulled`: workspace.fetch
    # receives that file as $1.
    github:
      enabled: false
      host: github.com
      loginClaim: ""
      roles: []                 # empty keeps Meada's default, the five built-in roles
      maxAgeSeconds: 5400       # the refresh schedule plus its longest run; at least 60
  # The data layer (ADR 0016). The URLs, which hold passwords, come only from the Secret: keys
  # migrate-url (the migrate step), write-url (the console and the refresh) and read-url (the nodes).
  postgres:
    enabled: false
    credentialsSecret: meada-postgres
    schema: meada
  # Needed by modules.oidc.github, for the refresh only: the App's private key, from the Secret.
  githubApp:
    enabled: false
    host: github.com
    api: https://api.github.com
    appId: 0
    privateKeySecret: meada-github-app   # key private-key
  # The SCIM directory on the console (needs modules.postgres and modules.oidc). The token comes
  # from the Secret (key token, at least 32 characters) and only the console reads it.
  directory:
    enabled: false
    tokenSecret: meada-scim
    userClaim: ""
    userAttribute: externalId   # or userName
    groupAttribute: displayName # or externalId
  # Named workspaces over shared indexing (ADR 0020 to 0022, spec S5): the [catalog] and [workspaces]
  # sections of the console and of the refresh job (never the nodes'). It needs modules.oidc.github,
  # console.enabled with console.operations, and a Postgres at schema version 8 (the migrate step).
  # `allow` lists patterns `<host>/<owner>/*` or `<host>/<owner>/<repo>`; `maxRepositories` has no
  # default because the cost of expanded coverage is yours (docs: discovery evidence). `mirrors` is
  # the root where workspace.fetch clones the repositories only named workspaces select: it receives
  # `meada workspace show --pulled` as $1 and must place each member at the path listed there.
  workspaces:
    enabled: false
    allow: []
    maxRepositories: 0
    mirrors: /data/mirrors
    maxWorkspaces: 200
    maxEntries: 100
# An example Postgres for evaluation, off by default and not for production: a single replica.
# Use your own Postgres 15 or later in production. It needs modules.postgres and the Secrets:
# passwordsSecret (keys postgres-password, migrate-password, write-password, read-password) and
# tlsSecret (tls.crt and tls.key, a certificate naming the Service <release>-meada-postgres).
postgres:
  enabled: false
  image: postgres:15-alpine
  storage: 10Gi
  passwordsSecret: meada-postgres-server
  tlsSecret: meada-postgres-tls
  resources: {}
cronJob:
  schedule: "*/10 * * * *"
  resources: {}

# Separate management console, disabled unless explicitly enabled.
# Preserve browser Host, Origin and Authorization. With OIDC, assets, config and
# /auth/callback remain public so the browser can complete PKCE login.
console:
  enabled: false
  replicaCount: 1
  listen: 7334
  publicUrl: https://console.example.internal
  clientId: meada-console
  audience: https://console.example.internal
  operations: false
  operatorGroups: []
  operatorClaim: ""
  resources: {}
  service:
    port: 7334
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: console.example.internal
    tls: []
