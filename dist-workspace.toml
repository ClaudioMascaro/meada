[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "npm"]
# npm would not create the unscoped `meada` (too close to existing names): the package is
# `@meada/meada`, under the project's npm organization
npm-scope = "@meada"
# Stage the npm package from the release workflow (reads the NPM_TOKEN repository secret); a
# maintainer promotes the staged version with 2FA (.github/workflows/publish-npm-staged.yml)
publish-jobs = ["./publish-npm-staged"]
# The staging job only reads the run's artifacts: drop the default id-token and packages grants
github-custom-job-permissions = { "publish-npm-staged" = { contents = "read" } }
# Run the dist plan on pull requests that touch the release configuration
pr-run-mode = "plan"
# Target platforms to build apps for (Rust target-triple syntax)
# Windows arm64 is out until it can be built: the default cargo-xwin cross-compile fails on
# `ring` (ureq's rustls), and dist 0.32 ships no arm64 Windows binary for a native runner
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
